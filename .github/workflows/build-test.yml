name: build-test
# PhotoPipeline CI（M2-T19 重构）
# 目标: 从"每轮 20-35 min + 每次只暴露一个问题"变成"首轮 ~8-12 min、可重复绿"。
#   ① 系统依赖: tools/ci-system-deps.txt 单一事实来源 + 构建后 soname 级覆盖自检（未覆盖项必须 0）
#   ② 缓存: Qt 工具链（aqt 下载是最贵的 setup 步）+ ccache（release/release-dev 共享同一份内容）
#           + vcpkg 二进制缓存（key 方案逐字保留，**改了就会弃掉已热的 ≈425MiB 缓存**）
#   ③ 拓扑: linux（release + ctest 23 + 金样 16）/ ui-smoke（release-dev + ctest -R ui_smoke）
#           / appimage（release + 四项内置烟测 + 产物启动烟测 + artifact）
#           / windows（M3-T11：windows-2025，release + release-dev 子集 + ctest 23/24 + 金样 16）
#           / winzip（M3-T11：windows-2025，release + make_winzip.py 五项烟测 + artifact）
#   ④ cache-gc: 滚动 key 每轮新增条目，独立 job 清理旧条目（幂等、不红 job）
#   ⑥ 可观测: 每 job 写 $GITHUB_STEP_SUMMARY（阶段耗时 / 缓存命中 / ctest 汇总 / 金样汇总 / 产物指纹）
# M3-T11(a): tag 推送不再触发日常 CI —— 显式 branches 过滤后，tag 推送匹配不到任何分支模式；
# 发行构建由 .github/workflows/release.yml（on: push: tags: ['v*']）负责。分支 push 与 PR 语义不变。
on:
  push:
    branches: ['**']
  pull_request:

# 同一分支上的新推送立即取消仍在跑的旧轮次：本仓推送频繁，这一条直接省掉大量无效轮次。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: read = checkout；actions: write = cache-gc job 的 gh cache delete。
permissions:
  contents: read
  actions: write

env:
  # job 级 env 只允许 github/needs/strategy/matrix/vars/secrets/inputs 上下文（**无 runner**），
  # 故绝对路径一律用 github.workspace；env 值不经过 shell，`~` 不会展开。
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  QT_DIR: ${{ github.workspace }}/Qt/6.8.3/gcc_64
  # vcpkg 二进制缓存目录：**必须**与下方 restore/save 的 path 完全一致，且 vcpkg 不创建它
  # （缺失即 FATAL_ERROR ⇒ "缓存目录预建" 步）。
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-binary
  # ccache：必须在 configure **之前**生效 —— CMakeLists.txt:32 在 configure 期探测 ccache 并设
  # CMAKE_CXX_COMPILER_LAUNCHER，且探测本身就"真编译一个空 TU"，缓存目录不可用即整体退化为无缓存。
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime
  QT_VERSION: 6.8.3
  VCPKG_TAG: 2026.07.29
  # AppImage 运行期需要 FUSE2，ubuntu-24.04 runner 默认不装 libfuse2 ⇒ 一律用内建解包模式
  # （同时让 appimagetool 与"跑产物"都免 FUSE、免网络）。
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # linux: release 构建 + ctest 全部 23 条 + 16 对金样
  # 注: 金样 driver（tests/golden/smoke.py）走 `photopipeline --dev`，而 `--dev` 只在
  #     PP_BUILD_DEV=ON 时编译（CMakeLists.txt:134）⇒ 本 job 除 release 外还需要一棵
  #     release-dev 构建树（同一 CMAKE_BUILD_TYPE=Release，仅 photopipeline 多一个宏）。
  #     为避免重复编译 130 个 target，只构建金样真正需要的两个二进制。
  # ────────────────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ── 准备块（linux / ui-smoke / appimage 三 job 逐字相同；warm-cache.yml 同源） ──
      - name: apt 系统依赖（tools/ci-system-deps.txt）
        # 单一清单 + 安装后覆盖自检（见后面的"系统依赖覆盖自检"步）。
        # 历史教训: 曾经每轮只补一个包（nasm → libgl-dev → libglx-dev → libopengl-dev → libegl1），
        # 一轮一个红灯；现在清单是产物派生出来的，缺什么由 soname 断言直接指出。
        run: bash tools/ci-install-deps.sh

      - name: Qt ${{ env.QT_VERSION }} 缓存（restore）
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/Qt/6.8.3/gcc_64
          # 精确 key（不含 run_id）：Qt 版本/平台/架构变才失效；宽前缀兜住 runner.arch 变化。
          key: qt-6.8.3-gcc_64-${{ runner.os }}-${{ runner.arch }}
          restore-keys: qt-6.8.3-gcc_64-

      - name: Qt ${{ env.QT_VERSION }} via aqtinstall
        # 只在**精确命中**时跳过：aqt 下载(~250MB)+解包(≈1.6GB) 是 setup 里最贵的一步。
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$GITHUB_WORKSPACE/Qt"

      - name: Qt 就绪断言
        # restore-keys 前缀命中时 cache-hit 为空但文件已恢复 ⇒ 断言以**文件存在**为准，
        # 而不是 cache-hit 输出（否则会白跑一次 aqt，或更糟：Qt 缺失却继续）。
        run: |
          test -f "$QT_DIR/lib/libQt6Core.so.6" || { echo "::error::Qt 缺失: $QT_DIR"; exit 1; }
          echo "Qt $(du -sh "$QT_DIR" | cut -f1) @ $QT_DIR"
          ls -1 "$QT_DIR/plugins/platforms/libqoffscreen.so" "$QT_DIR/plugins/platforms/libqxcb.so"

      - name: vcpkg ${{ env.VCPKG_TAG }}（pinned）
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          # checkout 必须早于 bootstrap —— 否则 bootstrap 从 master 源码编译出非 pinned 的
          # vcpkg 工具二进制，而 ports 树已是 pinned（工具/ports 版本不一致，R4 教训）。
          git -C "$VCPKG_ROOT" checkout "$VCPKG_TAG"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: 缓存目录预建
        # vcpkg 不创建二进制缓存目录：缺失即 FATAL_ERROR。必须早于 restore（cache miss 不会建目录）。
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$CCACHE_DIR"

      - name: vcpkg binary cache（restore）
        id: vcpkg-cache
        # ★ key 方案逐字保留（M2-T10a 定，改动 = 弃掉已热的 ≈425MiB 缓存，等于每轮多烧 20-30 min）:
        #   精确 key 含 hash/job/run_id/run_attempt ⇒ ① 每轮都能保存新条目（固定 key 会"首次保存
        #   即冻结半成品、之后永远命中不再更新"）② 各 job 不争抢同一 key ③ re-run 也能重新保存。
        #   宽前缀 vcpkg- 让"改了 overlay/manifest ⇒ hash 变"时仍能复用旧缓存：二进制缓存按 ABI
        #   内容寻址，ABI 已变的条目自然不命中，故跨 overlay 版本复用是安全的。
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-
            vcpkg-

      - name: ccache（restore）
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          # key 语义同 vcpkg（滚动 key 含 run_id + 宽前缀）。**不含 github.job**：
          # ① ccache 内容与 job 基本无关（release / release-dev 只差 photopipeline 的 16 个 TU）
          # ② 只由 linux job 保存（它编译 release + release-dev ⇒ 内容是其全集）
          # ⇒ 全仓每轮只新增 1 个 ccache 条目，也不会出现 3 个 job 并发保存同一 key 的竞态。
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: 语料存在性断言（不重新生成）
        # 语料已入库（tests/golden/**: base 16 文件 + smoke 断言 17 个 json）。历史 workflow 每轮跑
        # tools/gen_corpus.py 纯属浪费（且依赖 vcpkg 产物）；这里只做廉价断言，不重新生成。
        run: |
          n=$(git ls-files tests/golden/base | wc -l)
          m=$(git ls-files tests/golden/smoke | grep -c '\.json$')
          [ "$n" -ge 16 ] || { echo "::error::语料缺失: tests/golden/base = $n 个（期望 ≥16）"; exit 1; }
          [ "$m" -ge 16 ] || { echo "::error::金样断言缺失: tests/golden/smoke/*.json = $m 个（期望 ≥16）"; exit 1; }
          echo "语料 OK: base=$n 文件、smoke 断言=$m 个（均已入库，未重新生成）"
      # ── 准备块结束 ──

      - name: configure release（含 vcpkg install —— 缓存是否命中的直接体现）
        run: |
          T0=$(date +%s)
          cmake --preset release
          echo -e "configure release\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: build release
        run: |
          T0=$(date +%s)
          cmake --build --preset release
          echo -e "build release\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: ctest release（23 条）
        run: |
          T0=$(date +%s)
          set -o pipefail
          ctest --preset release 2>&1 | tee "$RUNNER_TEMP/ctest-release.log"
          echo -e "ctest release (23 条)\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: 系统依赖覆盖自检（soname 级硬断言，未覆盖项必须 0）
        # 用刚构建出来的真实产物反查 soname → 断言每个都由 tools/ci-system-deps.txt 的某个包提供。
        # 这是"每轮补一个包"的结构性终结手段：新 soname 会在这里变成 UNCOVERED 并给出包名。
        run: bash tools/ci-check-deps.sh build/release

      - name: configure release-dev（金样需要 PP_BUILD_DEV 的 --dev harness）
        run: |
          T0=$(date +%s)
          cmake --preset release-dev
          echo -e "configure release-dev\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: build release-dev 目标子集（photopipeline + pp_verify）
        # 金样 driver 只需要这两个二进制（smoke.sh 用 PP_BIN/PP_VERIFY）；全量 release-dev 由并行
        # 的 ui-smoke job 负责，故此处只构建子集（首次冷 ccache 时省 ~1.5 min）。
        run: |
          T0=$(date +%s)
          cmake --build build/release-dev --target photopipeline pp_verify
          echo -e "build release-dev 子集(photopipeline,pp_verify)\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: 金样 16 对（python3 tests/golden/smoke.py）
        run: |
          T0=$(date +%s)
          set -o pipefail
          python3 tests/golden/smoke.py build/release-dev 2>&1 | tee "$RUNNER_TEMP/golden.log"
          echo -e "golden smoke (16 对)\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: ccache 统计
        if: always()
        run: |
          set +e
          ccache -s > "$RUNNER_TEMP/ccache.txt" 2>&1
          echo "---- ccache -s -v（direct/preprocessed 命中细分）----" >> "$RUNNER_TEMP/ccache.txt"
          ccache -s -v 2>&1 | grep -E "cache hit|cache miss|Cacheable calls" >> "$RUNNER_TEMP/ccache.txt"
          cat "$RUNNER_TEMP/ccache.txt"

      - name: Qt ${{ env.QT_VERSION }} 缓存（save，仅 linux job 保存一次）
        # ⚠ 必须成对: 只有 restore 没有 save ⇒ 缓存永远不会被写入（本轮首跑的实测教训：
        #   run 35520386390 里 qt-* 条目数为 0，三个 job 每次都在重装 Qt）。
        # 单写者（linux job）+ 仅在**未命中**时保存: 三个 job 的 Qt 内容完全相同，
        # 让三个 job 都保存只会在同一 key 上撞 409；单写者既确定又无噪声。
        # if: always() ⇒ 即使后面的构建/测试失败，已经装好的 Qt 也照样入缓存（内容与构建无关）。
        if: always() && steps.qt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/Qt/6.8.3/gcc_64
          key: qt-6.8.3-gcc_64-${{ runner.os }}-${{ runner.arch }}

      - name: vcpkg binary cache（save）
        # if: always() —— 失败运行也保存已建好的端口：actions/cache v4 的 post 步是
        # post-if: success()，job 失败即不保存，会导致每次红灯都全冷重建 41 个端口。
        # continue-on-error —— 缓存服务异常不得把已通过的 job 弄红。
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: ccache（save，仅 linux job）
        # 只在 linux job 保存（理由见 restore 步注释）。
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'CMakePresets.json') }}-${{ github.run_id }}

      - name: 汇总 → $GITHUB_STEP_SUMMARY
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
          CCACHE_HIT: ${{ steps.ccache-cache.outputs.cache-hit }}
        run: |
          set +e
          {
            echo "## linux job 汇总"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Qt 缓存精确命中 | ${QT_HIT:-false} |"
            echo "| vcpkg 二进制缓存精确命中 | ${VCPKG_HIT:-false} |"
            echo "| ccache 缓存精确命中 | ${CCACHE_HIT:-false} |"
            echo "| run | ${GITHUB_RUN_ID} #${GITHUB_RUN_ATTEMPT} |"
            echo ""
            echo "| 阶段 | 秒 |"
            echo "| --- | --- |"
            awk -F'\t' '{printf "| %s | %s |\n", $1, $2}' "$RUNNER_TEMP/pp-steps.tsv" 2>/dev/null
            echo ""
            echo "**ctest 汇总**: $(grep -E '^[0-9]+% tests passed' "$RUNNER_TEMP/ctest-release.log" 2>/dev/null | tail -1)"
            echo ""
            echo "**金样汇总**: $(grep -E '^SMOKE total=' "$RUNNER_TEMP/golden.log" 2>/dev/null | tail -1)"
            echo ""
            echo "<details><summary>ccache -s</summary>"
            echo ""
            echo '```'
            head -30 "$RUNNER_TEMP/ccache.txt" 2>/dev/null
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # ui-smoke: release-dev 全量构建 + ctest -R ui_smoke（offscreen，无需 xvfb）
  # ────────────────────────────────────────────────────────────────────────────
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ── 准备块（与 linux job 逐字相同） ──
      - name: apt 系统依赖（tools/ci-system-deps.txt）
        run: bash tools/ci-install-deps.sh

      - name: Qt ${{ env.QT_VERSION }} 缓存（restore）
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/Qt/6.8.3/gcc_64
          key: qt-6.8.3-gcc_64-${{ runner.os }}-${{ runner.arch }}
          restore-keys: qt-6.8.3-gcc_64-

      - name: Qt ${{ env.QT_VERSION }} via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$GITHUB_WORKSPACE/Qt"

      - name: Qt 就绪断言
        run: |
          test -f "$QT_DIR/lib/libQt6Core.so.6" || { echo "::error::Qt 缺失: $QT_DIR"; exit 1; }
          echo "Qt $(du -sh "$QT_DIR" | cut -f1) @ $QT_DIR"
          ls -1 "$QT_DIR/plugins/platforms/libqoffscreen.so" "$QT_DIR/plugins/platforms/libqxcb.so"

      - name: vcpkg ${{ env.VCPKG_TAG }}（pinned）
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          # checkout 必须早于 bootstrap —— 否则 bootstrap 从 master 源码编译出非 pinned 的
          # vcpkg 工具二进制，而 ports 树已是 pinned（工具/ports 版本不一致，R4 教训）。
          git -C "$VCPKG_ROOT" checkout "$VCPKG_TAG"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: 缓存目录预建
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$CCACHE_DIR"

      - name: vcpkg binary cache（restore）
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-
            vcpkg-

      - name: ccache（restore）
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: 语料存在性断言（不重新生成）
        run: |
          n=$(git ls-files tests/golden/base | wc -l)
          m=$(git ls-files tests/golden/smoke | grep -c '\.json$')
          [ "$n" -ge 16 ] || { echo "::error::语料缺失: tests/golden/base = $n 个（期望 ≥16）"; exit 1; }
          [ "$m" -ge 16 ] || { echo "::error::金样断言缺失: tests/golden/smoke/*.json = $m 个（期望 ≥16）"; exit 1; }
          echo "语料 OK: base=$n 文件、smoke 断言=$m 个（均已入库，未重新生成）"
      # ── 准备块结束 ──

      - name: configure release-dev
        run: |
          T0=$(date +%s)
          cmake --preset release-dev
          echo -e "configure release-dev\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: build release-dev
        run: |
          T0=$(date +%s)
          cmake --build --preset release-dev
          echo -e "build release-dev\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: ctest -R ui_smoke（offscreen）
        run: |
          T0=$(date +%s)
          set -o pipefail
          ctest --preset release-dev -R ui_smoke --output-on-failure 2>&1 | tee "$RUNNER_TEMP/ui-smoke-ctest.log"
          echo -e "ctest -R ui_smoke\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: UI-SMOKE 冻结行取证（原文入 summary）
        # tests/ui_smoke.sh 把 harness 输出 tee 到临时文件、成功时只回显 "UI-SMOKE pass"，
        # 故这里直接跑一次 harness 本体，把冻结末行 `UI-SMOKE OK shots=8 pages=3` **原文** 取到
        # summary 里（ctest 仍是权威门禁，本步是取证 + 同一冻结断言的复述）。
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/release-dev/photopipeline --ui-smoke \
            --inputs "$GITHUB_WORKSPACE/tests/golden/base" \
            --shots "$RUNNER_TEMP/shots" 2>&1 | tee "$RUNNER_TEMP/ui-smoke-raw.log"
          grep -qx 'UI-SMOKE OK shots=8 pages=3' "$RUNNER_TEMP/ui-smoke-raw.log"

      - name: ccache 统计
        if: always()
        run: |
          set +e
          ccache -s > "$RUNNER_TEMP/ccache.txt" 2>&1
          echo "---- ccache -s -v（direct/preprocessed 命中细分）----" >> "$RUNNER_TEMP/ccache.txt"
          ccache -s -v 2>&1 | grep -E "cache hit|cache miss|Cacheable calls" >> "$RUNNER_TEMP/ccache.txt"
          cat "$RUNNER_TEMP/ccache.txt"

      - name: vcpkg binary cache（save）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 汇总 → $GITHUB_STEP_SUMMARY
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
          CCACHE_HIT: ${{ steps.ccache-cache.outputs.cache-hit }}
        run: |
          set +e
          {
            echo "## ui-smoke job 汇总"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Qt 缓存精确命中 | ${QT_HIT:-false} |"
            echo "| vcpkg 二进制缓存精确命中 | ${VCPKG_HIT:-false} |"
            echo "| ccache 缓存精确命中 | ${CCACHE_HIT:-false} |"
            echo ""
            echo "| 阶段 | 秒 |"
            echo "| --- | --- |"
            awk -F'\t' '{printf "| %s | %s |\n", $1, $2}' "$RUNNER_TEMP/pp-steps.tsv" 2>/dev/null
            echo ""
            echo "**ctest 汇总**: $(grep -E '^[0-9]+% tests passed' "$RUNNER_TEMP/ui-smoke-ctest.log" 2>/dev/null | tail -1)"
            echo ""
            echo "**UI-SMOKE 冻结行**: \`$(grep -x 'UI-SMOKE OK shots=8 pages=3' "$RUNNER_TEMP/ui-smoke-raw.log" 2>/dev/null | tail -1)\`"
            echo ""
            echo "<details><summary>ccache -s</summary>"
            echo ""
            echo '```'
            head -30 "$RUNNER_TEMP/ccache.txt" 2>/dev/null
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # appimage: release 构建 + AppImage 打包（内含四项烟测）+ 产物启动烟测 + artifact
  # ────────────────────────────────────────────────────────────────────────────
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ── 准备块（与 linux job 逐字相同） ──
      - name: apt 系统依赖（tools/ci-system-deps.txt）
        run: bash tools/ci-install-deps.sh

      - name: Qt ${{ env.QT_VERSION }} 缓存（restore）
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/Qt/6.8.3/gcc_64
          key: qt-6.8.3-gcc_64-${{ runner.os }}-${{ runner.arch }}
          restore-keys: qt-6.8.3-gcc_64-

      - name: Qt ${{ env.QT_VERSION }} via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$GITHUB_WORKSPACE/Qt"

      - name: Qt 就绪断言
        run: |
          test -f "$QT_DIR/lib/libQt6Core.so.6" || { echo "::error::Qt 缺失: $QT_DIR"; exit 1; }
          echo "Qt $(du -sh "$QT_DIR" | cut -f1) @ $QT_DIR"
          ls -1 "$QT_DIR/plugins/platforms/libqoffscreen.so" "$QT_DIR/plugins/platforms/libqxcb.so"

      - name: vcpkg ${{ env.VCPKG_TAG }}（pinned）
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          # checkout 必须早于 bootstrap —— 否则 bootstrap 从 master 源码编译出非 pinned 的
          # vcpkg 工具二进制，而 ports 树已是 pinned（工具/ports 版本不一致，R4 教训）。
          git -C "$VCPKG_ROOT" checkout "$VCPKG_TAG"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: 缓存目录预建
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$CCACHE_DIR"

      - name: vcpkg binary cache（restore）
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-
            vcpkg-

      - name: ccache（restore）
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: 语料存在性断言（不重新生成）
        run: |
          n=$(git ls-files tests/golden/base | wc -l)
          m=$(git ls-files tests/golden/smoke | grep -c '\.json$')
          [ "$n" -ge 16 ] || { echo "::error::语料缺失: tests/golden/base = $n 个（期望 ≥16）"; exit 1; }
          [ "$m" -ge 16 ] || { echo "::error::金样断言缺失: tests/golden/smoke/*.json = $m 个（期望 ≥16）"; exit 1; }
          echo "语料 OK: base=$n 文件、smoke 断言=$m 个（均已入库，未重新生成）"
      # ── 准备块结束 ──

      - name: configure release
        run: |
          T0=$(date +%s)
          cmake --preset release
          echo -e "configure release\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: build release
        run: |
          T0=$(date +%s)
          cmake --build --preset release
          echo -e "build release\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: 打包 AppImage（bash tools/make_appimage.sh dist）
        # 脚本内置**四项烟测**，任一失败即非零退出：① 打包前 ldd 自检（无 not found）
        # ② AppRun/desktop/结构断言 ③ M2-T18 依赖闭包硬门禁（A=not found、B=libQt6* 外泄）
        # ④ 产物内 usr/share/licenses 的 40 份 copyright。打包**全程离线**（appimagetool 已入库）。
        # PP_BUILD_DIR: make_appimage.sh 的默认产物目录是 build/m2-release（本地约定），
        # 而 CI 的 release 预设落在 build/release ⇒ 用脚本文档化的 env 覆盖对齐，不改脚本。
        env:
          PP_BUILD_DIR: build/release
        run: |
          T0=$(date +%s)
          set -o pipefail
          bash tools/make_appimage.sh dist 2>&1 | tee "$RUNNER_TEMP/appimage.log"
          echo -e "make_appimage（含 4 项内置烟测）\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: 产物指纹（sha256 / 体积 / 目标机系统要求条数）
        run: |
          APPIMAGE="$(ls -1 dist/PhotoPipeline-*-x86_64.AppImage | head -1)"
          DEPS="$(ls -1 dist/PhotoPipeline-*-deps.txt | head -1)"
          SHA="$(sha256sum "$APPIMAGE" | cut -d' ' -f1)"
          SIZE="$(stat -c '%s' "$APPIMAGE")"
          SYS="$(grep -cE '^  lib' "$DEPS" || true)"
          # GITHUB_ENV 的值在**后续**步骤才可见；本步的日志用上面这些局部量打印。
          {
            echo "APPIMAGE=$APPIMAGE"
            echo "APPIMAGE_NAME=$(basename "$APPIMAGE")"
            echo "APPIMAGE_SHA256=$SHA"
            echo "APPIMAGE_SIZE=$SIZE"
            echo "DEPS_TXT=$DEPS"
            echo "DEPS_SYS=${SYS:-0}"
          } >> "$GITHUB_ENV"
          echo "AppImage  $(basename "$APPIMAGE")"
          echo "sha256    $SHA"
          echo "体积      $SIZE bytes"
          echo "deps      $DEPS（目标机系统要求 ${SYS:-0} 条 soname）"

      - name: 产物启动烟测（offscreen；APPIMAGE_EXTRACT_AND_RUN 免 FUSE）
        # 这是**打包产物**级别的门禁，补足四项内置烟测（它们只做结构与闭包静态检查）：
        # 真实启动一次 GUI，验证随包 Qt/平台插件闭包能加载、进程不早退。M2-T18 的"双击无响应"
        # 属 B 类（插件 libQt6* 解析到系统 Qt 6.10）——那种情况在这里必然表现为启动即退出。
        # env -u DISPLAY/-u WAYLAND_DISPLAY：runner 无 X 是常态，同时也杜绝 AppRun 在**有** DISPLAY
        # 时走弹窗分支（zenity/xmessage 模态框会阻塞脚本，本地实测）。
        run: |
          set +e
          LOG="$RUNNER_TEMP/appimage-start.log"
          # 本步刻意**不**预建 `$HOME/.cache`：M2-T27 的 AppRun 缺陷（缺/不可写日志目录时静默
          # 退出）正是这个"干净目标机"语义抓到的，预建目录会掩盖回归。修复后产物无此依赖
          # （AppRun 自建目录 + 不可写即回退 /dev/null）。
          echo "== ① --version"
          env -u DISPLAY -u WAYLAND_DISPLAY QT_QPA_PLATFORM=offscreen \
            "$APPIMAGE" --version > "$RUNNER_TEMP/appimage-version.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/appimage-version.log"
          [ "$rc" -eq 0 ] || { echo "::error::AppImage --version 退出码 $rc"; exit 1; }
          grep -qE '^PhotoPipeline [0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/appimage-version.log" \
            || { echo "::error::AppImage --version 输出异常"; exit 1; }

          echo "== ② offscreen GUI 启动存活性（6s）"
          env -u DISPLAY -u WAYLAND_DISPLAY QT_QPA_PLATFORM=offscreen "$APPIMAGE" > "$LOG" 2>&1 &
          PID=$!
          sleep 6
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: 启动 6s 后仍存活（随包 Qt 与平台插件闭包可加载）"
            kill -TERM "$PID" 2>/dev/null; sleep 1; kill -KILL "$PID" 2>/dev/null
            pkill -x photopipeline 2>/dev/null   # 兜底清子进程（runner 是一次性的，不做硬断言）
          else
            wait "$PID"; rc=$?
            echo "::error::AppImage 启动后 6s 内退出（rc=$rc）"
            sed 's/^/  /' "$LOG"
            exit 1
          fi
          if grep -qE 'Could not load the Qt platform plugin|version `Qt_|cannot open shared object file|error while loading shared libraries' "$LOG"; then
            echo "::error::启动日志含依赖/插件加载失败特征:"; sed 's/^/  /' "$LOG"; exit 1
          fi
          echo "§ 产物启动烟测 PASS"

      - name: 上传 AppImage 与依赖清单（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPipeline-AppImage
          path: |
            dist/PhotoPipeline-*-x86_64.AppImage
            dist/PhotoPipeline-*-deps.txt
          if-no-files-found: error
          retention-days: 14

      - name: vcpkg binary cache（save）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 汇总 → $GITHUB_STEP_SUMMARY
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
          CCACHE_HIT: ${{ steps.ccache-cache.outputs.cache-hit }}
        run: |
          set +e
          {
            echo "## appimage job 汇总"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Qt 缓存精确命中 | ${QT_HIT:-false} |"
            echo "| vcpkg 二进制缓存精确命中 | ${VCPKG_HIT:-false} |"
            echo "| ccache 缓存精确命中 | ${CCACHE_HIT:-false} |"
            echo "| 产物 | ${APPIMAGE_NAME:-<无>} |"
            echo "| 体积 | ${APPIMAGE_SIZE:-?} bytes |"
            echo "| sha256 | \`${APPIMAGE_SHA256:-?}\` |"
            echo "| 目标机系统要求 | ${DEPS_SYS:-?} 条 soname（${DEPS_TXT:-?}） |"
            echo ""
            echo "| 阶段 | 秒 |"
            echo "| --- | --- |"
            awk -F'\t' '{printf "| %s | %s |\n", $1, $2}' "$RUNNER_TEMP/pp-steps.tsv" 2>/dev/null
            echo ""
            echo "**闭包门禁**: $(grep -E '① \[FAIL-A\]|② \[FAIL-B\]' "$RUNNER_TEMP/appimage.log" 2>/dev/null | sed 's/^ *//' | tr '\n' ' ')"
            echo ""
            echo "**许可烟测**: $(grep -E '烟测 ④' "$RUNNER_TEMP/appimage.log" 2>/dev/null | tail -1 | sed 's/^ *//')"
            echo ""
            echo "**启动烟测**: \`--version\` + offscreen GUI 6s 存活性 PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # windows: release + release-dev 两棵构建树 + ctest（23/24，含 offscreen ui_smoke）+ 金样 16
  # 注: `tools/env.py run --` 是 M3-T7 的 vcvars 注入入口（为 CI 无人值守设计）：它在子进程里
  #     准备 cl/ninja/cmake(venv)/Qt bin/PATH 后再执行命令。apt 与 ccache 无 Windows 对应物
  #     （runner 自带 nasm/7z/python/cmake/ninja；MSVC 无 ccache，CMakeLists 的探测已排除 MSVC）。
  #     本 job 按规格只构建 release-dev 的**金样子集**（photopipeline + pp_verify），故不跑
  #     `ctest --preset release-dev`（缺测试二进制）；Windows 侧的 offscreen ui_smoke 覆盖
  #     由 winzip job 的 E-2（`--smoke-exe`，断言冻结行 UI-SMOKE OK shots=8 pages=3）承担。
  # ────────────────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-2025
    timeout-minutes: 120        # 冷路径：vcpkg 41 port Windows 冷构建 ≈25–40 min + Qt ≈3 min + 两棵树 ≈10 min
    env:
      QT_DIR: ${{ github.workspace }}/Qt/6.8.3/msvc2022_64
    steps:
      - uses: actions/checkout@v4

      # ── 准备块（windows / winzip 两 job 逐字相同；对齐 linux job 的 S2–S10，去掉 apt 与 ccache） ──
      - name: Qt ${{ env.QT_VERSION }} 缓存（restore）
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/Qt/6.8.3/msvc2022_64
          # 精确 key（不含 run_id）：Qt 版本/平台/架构变才失效；宽前缀兜住 runner.arch 变化。
          # 前缀含 win64_msvc2022_64 ⇒ 与 Linux 的 qt-6.8.3-gcc_64- 严格分离（防跨平台串味）。
          key: qt-6.8.3-win64_msvc2022_64-${{ runner.os }}-${{ runner.arch }}
          restore-keys: qt-6.8.3-win64_msvc2022_64-

      - name: Qt ${{ env.QT_VERSION }} via aqtinstall
        # 只在**精确命中**时跳过：aqt 下载+解包是 setup 里最贵的一步。
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop "$env:QT_VERSION" win64_msvc2022_64 -O "$env:GITHUB_WORKSPACE/Qt"

      - name: Qt 就绪断言
        # restore-keys 前缀命中时 cache-hit 为空但文件已恢复 ⇒ 断言以**文件存在**为准。
        run: |
          $paths = @(
            "$env:QT_DIR\bin\Qt6Core.dll",
            "$env:QT_DIR\plugins\platforms\qwindows.dll",
            "$env:QT_DIR\plugins\platforms\qoffscreen.dll"
          )
          $missing = @($paths | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { Write-Error "Qt 缺失: $($missing -join ', ')"; exit 1 }
          Write-Output "Qt OK @ $env:QT_DIR"

      - name: vcpkg ${{ env.VCPKG_TAG }}（pinned）
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          # checkout 必须早于 bootstrap —— 否则 bootstrap 从 master 源码编译出非 pinned 的
          # vcpkg 工具二进制，而 ports 树已是 pinned（工具/ports 版本不一致，R4 教训）。
          git -C "$env:VCPKG_ROOT" checkout "$env:VCPKG_TAG"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: 缓存目录预建
        # vcpkg 不创建二进制缓存目录：缺失即 FATAL_ERROR。必须早于 restore（cache miss 不会建目录）。
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: vcpkg binary cache（restore）
        id: vcpkg-cache
        # ★ key 前缀必须是 vcpkgwin-：与 Linux 的 vcpkg- 前缀严格分离，否则两侧会互相还原对方的
        #   二进制条目（ABI 不同平台，命中即坏）。滚动 key 语义与 Linux 侧一致（见 linux job 注释）。
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkgwin-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkgwin-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-
            vcpkgwin-

      - name: 语料存在性断言（不重新生成）
        # 语义与 Linux 侧逐字等价（PowerShell 版）：base ≥16 文件、smoke 断言 ≥16 个 json。
        run: |
          $n = @(git ls-files tests/golden/base).Count
          $m = @(git ls-files tests/golden/smoke | Where-Object { $_ -like '*.json' }).Count
          if ($n -lt 16) { Write-Error "语料缺失: tests/golden/base = $n 个（期望 ≥16）"; exit 1 }
          if ($m -lt 16) { Write-Error "金样断言缺失: tests/golden/smoke/*.json = $m 个（期望 ≥16）"; exit 1 }
          Write-Output "语料 OK: base=$n 文件、smoke 断言=$m 个（均已入库，未重新生成）"
      # ── 准备块结束 ──

      - name: configure release（含 vcpkg install —— 缓存是否命中的直接体现）
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --preset release
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "configure release`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: build release
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --build --preset release
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "build release`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: ctest release（23 条）
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- ctest --preset release --output-on-failure 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\ctest-release.log"
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "ctest release (23 条)`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: configure release-dev（金样需要 PP_BUILD_DEV 的 --dev harness）
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --preset release-dev
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "configure release-dev`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: build release-dev 目标子集（photopipeline + pp_verify）
        # 金样 driver 只需要这两个二进制；release-dev 全量构建（含 ui_smoke 用例）留给本 job 的
        # ctest 之外的并行 job 不必要 —— Windows 上两棵树成本高，故只构建子集。
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --build build/release-dev --target photopipeline pp_verify
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "build release-dev 子集(photopipeline,pp_verify)`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: 金样 16 对（python tests/golden/smoke.py）
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- python tests/golden/smoke.py build/release-dev 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\golden.log"
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "golden smoke (16 对)`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: vcpkg binary cache（save）
        # if: always() + continue-on-error（理由同 linux job）: 失败运行也保存已建好的端口。
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkgwin-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Qt ${{ env.QT_VERSION }} 缓存（save，单写者=本 job）
        # 单写者：winzip job 不保存 Qt（内容与 windows job 完全相同），避免同一 key 上撞 409。
        if: always() && steps.qt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/Qt/6.8.3/msvc2022_64
          key: qt-6.8.3-win64_msvc2022_64-${{ runner.os }}-${{ runner.arch }}

      - name: 汇总 → $GITHUB_STEP_SUMMARY
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
        run: |
          $lines = @()
          $lines += "## windows job 汇总"
          $lines += ""
          $lines += "| 项目 | 值 |"
          $lines += "| --- | --- |"
          $lines += "| Qt 缓存精确命中 | $($env:QT_HIT) |"
          $lines += "| vcpkg 二进制缓存精确命中 | $($env:VCPKG_HIT) |"
          $lines += "| run | $($env:GITHUB_RUN_ID) #$($env:GITHUB_RUN_ATTEMPT) |"
          $lines += ""
          $lines += "| 阶段 | 秒 |"
          $lines += "| --- | --- |"
          if (Test-Path "$env:RUNNER_TEMP\pp-steps.tsv") {
            Import-Csv -Path "$env:RUNNER_TEMP\pp-steps.tsv" -Delimiter "`t" -Header step,sec |
              ForEach-Object { $lines += "| $($_.step) | $($_.sec) |" }
          }
          $lines += ""
          $ctestLine = (Get-Content "$env:RUNNER_TEMP\ctest-release.log" -ErrorAction SilentlyContinue |
                        Where-Object { $_ -match '^[0-9]+% tests passed' } | Select-Object -Last 1)
          $goldenLine = (Get-Content "$env:RUNNER_TEMP\golden.log" -ErrorAction SilentlyContinue |
                         Where-Object { $_ -match '^SMOKE total=' } | Select-Object -Last 1)
          $lines += "**ctest 汇总**: $ctestLine"
          $lines += ""
          $lines += "**金样汇总**: $goldenLine"
          $lines | Add-Content "$env:GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # winzip: release 构建 + tools/make_winzip.py（内置闭包/来源/结构/许可/启动四项烟测）+ artifact
  # 注: make_winzip.py 自带 CRT app-local 部署（Microsoft.VC*.CRT）与门禁 A/B/C/D/E，
  #     与 AppImage 后端四项烟测同口径；--smoke-exe 追加 offscreen ui-smoke 走查（E-2）。
  # ────────────────────────────────────────────────────────────────────────────
  winzip:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      QT_DIR: ${{ github.workspace }}/Qt/6.8.3/msvc2022_64
    steps:
      - uses: actions/checkout@v4

      # ── 准备块（与 windows job 逐字相同） ──
      - name: Qt ${{ env.QT_VERSION }} 缓存（restore）
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/Qt/6.8.3/msvc2022_64
          key: qt-6.8.3-win64_msvc2022_64-${{ runner.os }}-${{ runner.arch }}
          restore-keys: qt-6.8.3-win64_msvc2022_64-

      - name: Qt ${{ env.QT_VERSION }} via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop "$env:QT_VERSION" win64_msvc2022_64 -O "$env:GITHUB_WORKSPACE/Qt"

      - name: Qt 就绪断言
        run: |
          $paths = @(
            "$env:QT_DIR\bin\Qt6Core.dll",
            "$env:QT_DIR\plugins\platforms\qwindows.dll",
            "$env:QT_DIR\plugins\platforms\qoffscreen.dll"
          )
          $missing = @($paths | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { Write-Error "Qt 缺失: $($missing -join ', ')"; exit 1 }
          Write-Output "Qt OK @ $env:QT_DIR"

      - name: vcpkg ${{ env.VCPKG_TAG }}（pinned）
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout "$env:VCPKG_TAG"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: 缓存目录预建
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: vcpkg binary cache（restore）
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkgwin-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkgwin-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-
            vcpkgwin-

      - name: 语料存在性断言（不重新生成）
        # 对齐 appimage job 的做法：打包依赖 tests/golden/base（E-2 走查输入），故保留断言。
        run: |
          $n = @(git ls-files tests/golden/base).Count
          $m = @(git ls-files tests/golden/smoke | Where-Object { $_ -like '*.json' }).Count
          if ($n -lt 16) { Write-Error "语料缺失: tests/golden/base = $n 个（期望 ≥16）"; exit 1 }
          if ($m -lt 16) { Write-Error "金样断言缺失: tests/golden/smoke/*.json = $m 个（期望 ≥16）"; exit 1 }
          Write-Output "语料 OK: base=$n 文件、smoke 断言=$m 个（均已入库，未重新生成）"
      # ── 准备块结束 ──

      - name: configure release
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --preset release
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "configure release`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: build release
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --build --preset release
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "build release`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: configure + build release-dev 子集（photopipeline，供 E-2 offscreen 走查）
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --preset release-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/env.py run -- cmake --build build/release-dev --target photopipeline
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "configure + build release-dev 子集(photopipeline)`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: 打包 win64 zip（tools/make_winzip.py，内置五项烟测）
        # 门禁 A 闭包（三判据 + MUST_BUNDLE）/ B Qt 来源 sha256 / C 结构 / D 许可（写盘前 + zip 内）
        # / E 启动（staging --version + 可选 offscreen --ui-smoke）；任一失败即非零退出。
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- python tools/make_winzip.py dist --smoke-exe build/release-dev/photopipeline.exe 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\winzip.log"
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP\pp-steps.tsv" "make_winzip（含 5 项内置烟测）`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: 产物指纹（sha256 / 体积 / 条目数）→ GITHUB_ENV
        run: |
          $zip = (Get-ChildItem dist\PhotoPipeline-*-win64.zip | Select-Object -First 1).FullName
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $size = (Get-Item $zip).Length
          $entries = python -c "import zipfile,sys; print(len(zipfile.ZipFile(sys.argv[1]).namelist()))" $zip
          # GITHUB_ENV 的值在**后续**步骤才可见；本步日志用局部量打印。
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$([IO.Path]::GetFileName($zip))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_ENTRIES=$entries" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINZIP_LOG=$env:RUNNER_TEMP\winzip.log" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "zip     $([IO.Path]::GetFileName($zip))"
          Write-Output "sha256  $hash"
          Write-Output "体积    $size bytes"
          Write-Output "条目    $entries"

      - name: 上传 win64 zip（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPipeline-win64
          path: dist/PhotoPipeline-*-win64.zip
          if-no-files-found: error
          retention-days: 14

      - name: vcpkg binary cache（save）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkgwin-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 汇总 → $GITHUB_STEP_SUMMARY
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
        run: |
          $log = @(Get-Content "$env:RUNNER_TEMP\winzip.log" -ErrorAction SilentlyContinue)
          function GateLine($pattern) { ($log | Where-Object { $_ -match $pattern } | Select-Object -Last 1) }
          $lines = @()
          $lines += "## winzip job 汇总"
          $lines += ""
          $lines += "| 项目 | 值 |"
          $lines += "| --- | --- |"
          $lines += "| Qt 缓存精确命中 | $($env:QT_HIT) |"
          $lines += "| vcpkg 二进制缓存精确命中 | $($env:VCPKG_HIT) |"
          $lines += "| 产物 | $($env:ZIP_NAME) |"
          $lines += "| 体积 | $($env:ZIP_SIZE) bytes |"
          $lines += "| sha256 | $($env:ZIP_SHA256) |"
          $lines += "| zip 条目 | $($env:ZIP_ENTRIES) |"
          $lines += ""
          $lines += "| 阶段 | 秒 |"
          $lines += "| --- | --- |"
          if (Test-Path "$env:RUNNER_TEMP\pp-steps.tsv") {
            Import-Csv -Path "$env:RUNNER_TEMP\pp-steps.tsv" -Delimiter "`t" -Header step,sec |
              ForEach-Object { $lines += "| $($_.step) | $($_.sec) |" }
          }
          $lines += ""
          $lines += "**门禁 A（闭包）**: $(GateLine '闭包门禁 A')"
          $lines += ""
          $lines += "**门禁 B（Qt 来源）**: $(GateLine '来源门禁 B')"
          $lines += ""
          $lines += "**断言 C（结构）**: $(GateLine '结构断言 C')"
          $lines += ""
          $lines += "**断言 D（许可）**: $(GateLine '许可断言 D')"
          $lines += ""
          $lines += "**烟测 E-1 / E-2**: $(GateLine '烟测 E-1') ｜ $(GateLine '烟测 E-2')"
          $lines += ""
          $lines += "**产物内复核**: $(GateLine '产物内复核')"
          $lines | Add-Content "$env:GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # cache-gc: 清理滚动 key 产生的旧条目（④）
  # 独立 job（而不是塞进某个 job 的步骤）的理由: 它在全部构建 job（linux/ui-smoke/appimage/
  # windows/winzip）**全部结束后**才跑，不可能删掉并行 job 仍要 restore 的条目；
  # 且失败/取消都不影响构建 job 的结论。
  # ────────────────────────────────────────────────────────────────────────────
  cache-gc:
    needs: [linux, ui-smoke, appimage, windows, winzip]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 缓存清理（保留最新 8 个 / 7 天；幂等，失败不红 job）
        # 只碰 vcpkg-* / ccache-*；qt-* 永不删除。continue-on-error + 脚本内部一律 exit 0 双保险。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci-cache-gc.sh
