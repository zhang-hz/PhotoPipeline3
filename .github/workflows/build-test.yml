name: build-test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    # 显式上限：冷缓存 vcpkg 全量构建 + Qt/OIIO/exiv2/jpegli 编译远超默认预期，
    # 默认 360min 过于宽松，统一与 ui-smoke 对齐为 180。
    timeout-minutes: 180
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      QT_DIR: ${{ github.workspace }}/Qt/6.8.3/gcc_64
      # 必须绝对路径：env 值不经过 shell，`~` 不会展开（首跑 35512612876 根因）。
      # 用 github.workspace 而非 runner.temp：job 级 env 只允许 github/needs/strategy/matrix/vars/secrets/inputs
      # （runner context 不可用，见 Actions Context availability）；此式与 tools/env.sh 的本地缓存布局一致。
      # 下方 `vcpkg binary cache` 的 path 必须与本值保持一致。
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-binary
    steps:
      - uses: actions/checkout@v4
      - name: apt deps
        # nasm: svt-av1 / aom / libwebp 等 x86 SIMD 端口经 vcpkg_find_acquire_program(NASM)
        # 要求系统提供 nasm（vcpkg-tool 不再自动下载构建工具，缺失即 BUILD_FAILED → 35513359184）。
        # libgl/glx/opengl-dev: Qt6Gui 的 find_dependency(WrapOpenGL) 需要 CMake FindOpenGL 的
        # OPENGL_INCLUDE_DIR / OPENGL_opengl_LIBRARY / OPENGL_glx_LIBRARY 三个变量，缺失即
        # Qt6Gui→Qt6Widgets→Qt6 逐级 NOT FOUND（CMakeLists.txt:66，run 35517286929）。
        # 三包与三变量一一对应：libgl-dev=GL/gl.h、libopengl-dev=libOpenGL.so、libglx-dev=libGLX.so。
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache pkg-config python3-pip nasm libgl-dev libglx-dev libopengl-dev
      - name: Qt via aqtinstall
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$GITHUB_WORKSPACE/Qt"
      - name: vcpkg pinned
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          # R4: checkout 必须早于 bootstrap —— 否则 bootstrap 从 master 源码编译出
          # 非 pinned 的 vcpkg 工具二进制，而 ports 树已是 pinned（工具/ports 版本不一致）。
          git -C "$VCPKG_ROOT" checkout 2026.07.29
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: vcpkg binary cache dir
        # vcpkg 不创建该目录：缺失即 FATAL_ERROR（本地实测，见 M2-T10a 报告）
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: vcpkg binary cache (restore)
        # 滚动 key + restore-keys 前缀：每次运行都命中上一轮最新缓存并继续增长；
        # 固定的精确 key 会"首次保存即冻结半成品、之后永远命中不再更新"（旧方案缺陷）。
        # key 末段含 job/run_id/run_attempt：① 两个 job 不争抢同一 key ② re-run 也能重新保存。
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          # 顺序：先具体 hash 前缀，后宽前缀 vcpkg-。
          # 宽前缀让"改了 overlay/manifest ⇒ hash 变"时仍能复用旧缓存：vcpkg 二进制缓存按
          # ABI 内容寻址，ABI 已变的条目自然不命中，故跨 overlay 版本复用是安全的（ABI 含
          # portfile 内容，T15 与本轮的 overlay 修改都会让对应端口自然失效、其余端口照常复用）。
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-
            vcpkg-
      - name: build + corpus + test
        run: |
          cmake --preset release
          cmake --build --preset release
          bash tools/gen_corpus.sh
          ctest --preset release
      - name: vcpkg binary cache (save)
        # if: always() —— 失败运行也保存已建好的端口。actions/cache v4 的 post 步是
        # post-if: success()，job 失败即不保存，导致每次红灯都全冷重建 41 个端口。
        # continue-on-error —— 缓存服务异常不得把已通过的 job 弄红。
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

  ui-smoke:
    runs-on: ubuntu-24.04
    # 60 → 180：冷缓存 vcpkg 全量构建可能 >60min 被杀（M2-T10a 预授权提额）。
    timeout-minutes: 180
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      QT_DIR: ${{ github.workspace }}/Qt/6.8.3/gcc_64
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-binary
    steps:
      - uses: actions/checkout@v4
      - name: apt deps
        # nasm: svt-av1 / aom / libwebp 等 x86 SIMD 端口经 vcpkg_find_acquire_program(NASM)
        # 要求系统提供 nasm（vcpkg-tool 不再自动下载构建工具，缺失即 BUILD_FAILED → 35513359184）。
        # libgl/glx/opengl-dev: Qt6Gui 的 find_dependency(WrapOpenGL) 需要 CMake FindOpenGL 的
        # OPENGL_INCLUDE_DIR / OPENGL_opengl_LIBRARY / OPENGL_glx_LIBRARY 三个变量，缺失即
        # Qt6Gui→Qt6Widgets→Qt6 逐级 NOT FOUND（CMakeLists.txt:66，run 35517286929）。
        # 三包与三变量一一对应：libgl-dev=GL/gl.h、libopengl-dev=libOpenGL.so、libglx-dev=libGLX.so。
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache pkg-config python3-pip nasm libgl-dev libglx-dev libopengl-dev
      - name: Qt via aqtinstall
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$GITHUB_WORKSPACE/Qt"
      - name: vcpkg pinned
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          # R4: checkout 必须早于 bootstrap —— 否则 bootstrap 从 master 源码编译出
          # 非 pinned 的 vcpkg 工具二进制，而 ports 树已是 pinned（工具/ports 版本不一致）。
          git -C "$VCPKG_ROOT" checkout 2026.07.29
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: vcpkg binary cache dir
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: vcpkg binary cache (restore)
        # 滚动 key + restore-keys 前缀：每次运行都命中上一轮最新缓存并继续增长；
        # 固定的精确 key 会"首次保存即冻结半成品、之后永远命中不再更新"（旧方案缺陷）。
        # key 末段含 job/run_id/run_attempt：① 两个 job 不争抢同一 key ② re-run 也能重新保存。
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          # 顺序：先具体 hash 前缀，后宽前缀 vcpkg-。
          # 宽前缀让"改了 overlay/manifest ⇒ hash 变"时仍能复用旧缓存：vcpkg 二进制缓存按
          # ABI 内容寻址，ABI 已变的条目自然不命中，故跨 overlay 版本复用是安全的（ABI 含
          # portfile 内容，T15 与本轮的 overlay 修改都会让对应端口自然失效、其余端口照常复用）。
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-
            vcpkg-
      - name: build release-dev + ui smoke
        # ui_smoke 经 tests/golden/base --inputs 自测（39 文件已入库），无需 gen_corpus；
        # QT_QPA_PLATFORM=offscreen 由 CMake add_test 注入，无需 xvfb。
        run: |
          cmake --preset release-dev
          cmake --build --preset release-dev
          ctest --preset release-dev -R ui_smoke --output-on-failure
      - name: vcpkg binary cache (save)
        # if: always() —— 失败运行也保存已建好的端口（见 linux job 同名步骤说明）。
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
