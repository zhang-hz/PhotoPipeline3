          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # regression（预算 12 min）: 回归基线 diff（设计 §12.1 夜间道第二段）
  #   tools/regression.py = workers=1 归一化全语料（27 输入 × 8 格式 + 仅元数据 × 4 格式 = 12 次调用、
  #   280 文件槽），与 tools/baseline/golden.log 逐行比对（0 diff 才绿）。
  #   Windows 基线 tools/baseline/golden.windows.log（M3 遗留 §8-11）：R-016 起由 regression-windows
  #   job 真比对；本 job 只做两平台基线的存在性/形态断言。
  # ────────────────────────────────────────────────────────────────────────────
  regression:
    name: regression（回归基线 diff）
    runs-on: ubuntu-24.04
    timeout-minutes: 20         # 硬顶（预算 12 min）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Qt 路径（QT_VERSION 单源 = tools/versions.env；R-063 去版本字面量）
        run: echo "QT_DIR=$GITHUB_WORKSPACE/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: apt 系统依赖（tools/ci-system-deps.txt）
        run: bash tools/ci-install-deps.sh

      - name: Qt ${{ env.QT_VERSION }} 缓存（restore，写者=main-full 的 linux job）
        id: qt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/gcc_64
          key: qt-${{ env.QT_VERSION }}-gcc_64-${{ runner.os }}-${{ runner.arch }}
          restore-keys: qt-${{ env.QT_VERSION }}-gcc_64-

      - name: Qt 就绪断言（缺失 ⇒ 早失败，指路 warm-cache）
        run: |
          test -f "$QT_DIR/lib/libQt6Core.so.6" || {
            echo "::error::Qt 缺失（未播种）: $QT_DIR"
            echo "::error::→ 先跑 Actions → warm-cache → Run workflow 播种 Qt $QT_VERSION / linux_gcc_64（设计 §12.4）"
            exit 1
          }
          echo "Qt OK @ $QT_DIR"

      - name: vcpkg ${{ env.VCPKG_TAG }}（pinned）
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_TAG"
          want_sha="$(sed -n 's/^VCPKG_SHA=//p' tools/versions.env | tr -d '\r')"
          got_sha="$(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          [ "$got_sha" = "$want_sha" ] || { echo "::error::vcpkg HEAD $got_sha != VCPKG_SHA $want_sha（R-091）"; exit 1; }
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: 缓存目录预建
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$CCACHE_DIR"

      - name: vcpkg binary cache（restore）
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ hashFiles('triplets/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ hashFiles('triplets/**') }}-
            vcpkg-

      - name: vcpkg 缓存暖度断言（miss ⇒ 早失败，指路 warm-cache）
        run: |
          n=$(find "$VCPKG_DEFAULT_BINARY_CACHE" -type f -name '*.zip' 2>/dev/null | wc -l)
          echo "vcpkg binary cache archives = $n（判据 ≥ $PP_VCPKG_WARM_MIN）"
          if [ "$n" -lt "$PP_VCPKG_WARM_MIN" ]; then
            echo "::error::vcpkg 二进制缓存未播种（archive=$n）—— 冷构建 ≈40 min，直接击穿硬顶。"
            echo "::error::→ 先跑 Actions → warm-cache → Run workflow 播种（设计 §12.4 / R24）。"
            exit 1
          fi

      - name: ccache（restore，写者=main-full 的 linux job）
        # 本 job 编的是 release-dev 树 —— 与 main-full linux job 的 flags 完全一致 ⇒ ccache 有命中价值。
        id: ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'CMakePresets.json') }}-${{ hashFiles('cmake/**', 'triplets/**') }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: 回归基线存在性/形态断言（golden.log + golden.windows.log，T17 完善双平台口径）
        run: |
          for f in tools/baseline/golden.log tools/baseline/golden.windows.log; do
            [ -f "$f" ] || { echo "::error::基线缺失: $f"; exit 1; }
            n=$(wc -l < "$f")
            [ "$n" -ge 1000 ] || { echo "::error::基线行数异常: $f = $n 行（期望 ≥1000）"; exit 1; }
            head -1 "$f" | grep -q '^# =' || { echo "::error::基线头部指纹异常: $f"; exit 1; }
            echo "$f: $n 行；head: $(sed -n '2p' "$f")"
          done
          a=$(wc -l < tools/baseline/golden.log); b=$(wc -l < tools/baseline/golden.windows.log)
          echo "双平台基线行数: linux=$a windows=$b（Windows 腿由 regression-windows job 真比对，R-016；本 job 只做形态断言）"

      - name: configure + build release-dev 金样二进制（photopipeline + pp_verify）
        run: |
          set -o pipefail
          T0=$(date +%s)
          cmake --preset release-dev
          T1=$(date +%s)
          cmake --build build/release-dev --target photopipeline pp_verify
          T2=$(date +%s)
          {
            echo -e "configure release-dev\t$(( T1 - T0 ))"
            echo -e "build release-dev 子集(photopipeline,pp_verify)\t$(( T2 - T1 ))"
          } >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: 回归基线 diff（python3 tools/regression.py；0 diff 才绿）
        # 退出码: 0 = 0 diff；1 = 有 diff（前 40 行）；2 = 环境缺失。三种都直接透传 ⇒ 红/绿口径单一。
        # 维护模式（update_baseline=true）由下一条步骤接管；计划/普通手动轮次（inputs 为空）照跑。
        if: ${{ inputs.update_baseline != true }}
        run: |
          set -o pipefail
          T0=$(date +%s)
          python3 tools/regression.py build/release-dev 2>&1 | tee "$RUNNER_TEMP/regression.log"
          echo -e "regression diff（12 次调用 / 280 文件槽）\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: （维护模式）重生成 Linux 基线（--update；口径动作）
        # 只在 workflow_dispatch + update_baseline=true 时执行（M5-T14 起）。产出 = 运行器工作树里的
        # tools/baseline/golden.log —— 由下一条步骤上传，人工复核后入库；本 job 不做任何提交。
        if: ${{ inputs.update_baseline == true }}
        run: |
          set -o pipefail
          T0=$(date +%s)
          python3 tools/regression.py build/release-dev --update 2>&1 | tee "$RUNNER_TEMP/regression-update.log"
          echo -e "regression update（12 次调用 / 280 文件槽）\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"
          wc -l tools/baseline/golden.log

      - name: （维护模式）上传 golden.log + 归一化运行日志 artifact
        if: ${{ inputs.update_baseline == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux-golden-baseline
          retention-days: 7
          path: |
            tools/baseline/golden.log
            .cache/regression/current.log
          if-no-files-found: error

      - name: 汇总 → $GITHUB_STEP_SUMMARY
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
          CCACHE_HIT: ${{ steps.ccache-cache.outputs.cache-hit }}
        run: |
          set +e
          {
            echo "## regression job 汇总（预算 12 min / 硬顶 20 min）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 判据 | tools/regression.py 归一化全语料 vs \`tools/baseline/golden.log\`（0 diff）|"
            echo "| 双平台基线 | Linux=本 job diff；Windows=regression-windows job diff（R-016）|"
            echo "| Qt / vcpkg / ccache 缓存命中 | ${QT_HIT:-false} / ${VCPKG_HIT:-false} / ${CCACHE_HIT:-false} |"
            echo ""
            echo "| 阶段 | 秒 |"
            echo "| --- | --- |"
            awk -F'\t' '{printf "| %s | %s |\n", $1, $2}' "$RUNNER_TEMP/pp-steps.tsv" 2>/dev/null
            echo ""
            echo "**diff 结论**: $(grep -E '^regression: ' "$RUNNER_TEMP/regression.log" 2>/dev/null | tail -3 | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # audit（预算 5 min）: 许可/SPDX（collect_licenses.py --check）+ 依赖审计（pp_linkprobe）
  #   * 许可/SPDX 判据 = 设计 §12.2「许可 ≥30 且 SPDX 100%」（与 main-full 的 audit job 同一命令）。
  #   * 依赖审计 = pp_linkprobe（M0 §12.1 行为契约：OIIO 插件面 / libheif 编码器名单 / exiv2-bmff
  #     / libjxl / jpegli 静态直调层 / 内省面断言，退出码 = FAIL 数）—— nightly 用它盯**依赖漂移**
  #     （R4/R26：vcpkg 升级或上游行为变化会在这里变成 FAIL）。
  # ────────────────────────────────────────────────────────────────────────────
  audit:
    name: audit（许可/SPDX/依赖）
    runs-on: ubuntu-24.04
    timeout-minutes: 20         # 硬顶（预算 5 min）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Qt 路径（QT_VERSION 单源 = tools/versions.env；R-063 去版本字面量）
        run: echo "QT_DIR=$GITHUB_WORKSPACE/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: apt 系统依赖（tools/ci-system-deps.txt）
        run: bash tools/ci-install-deps.sh

      - name: Qt ${{ env.QT_VERSION }} 缓存（restore，写者=main-full 的 linux job）
        id: qt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/gcc_64
          key: qt-${{ env.QT_VERSION }}-gcc_64-${{ runner.os }}-${{ runner.arch }}
          restore-keys: qt-${{ env.QT_VERSION }}-gcc_64-

      - name: Qt 就绪断言（配置阶段 find_package(Qt6) 需要）
        run: |
          test -f "$QT_DIR/lib/libQt6Core.so.6" || {
            echo "::error::Qt 缺失（未播种）: $QT_DIR —— 先跑 warm-cache 播种（设计 §12.4）"; exit 1; }
          echo "Qt OK @ $QT_DIR"

      - name: vcpkg ${{ env.VCPKG_TAG }}（pinned）
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_TAG"
          want_sha="$(sed -n 's/^VCPKG_SHA=//p' tools/versions.env | tr -d '\r')"
          got_sha="$(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          [ "$got_sha" = "$want_sha" ] || { echo "::error::vcpkg HEAD $got_sha != VCPKG_SHA $want_sha（R-091）"; exit 1; }
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: 缓存目录预建
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: vcpkg binary cache（restore）
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ hashFiles('triplets/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ hashFiles('triplets/**') }}-
            vcpkg-

      - name: vcpkg 缓存暖度断言（miss ⇒ 早失败，指路 warm-cache）
        run: |
          n=$(find "$VCPKG_DEFAULT_BINARY_CACHE" -type f -name '*.zip' 2>/dev/null | wc -l)
          echo "vcpkg binary cache archives = $n（判据 ≥ $PP_VCPKG_WARM_MIN）"
          if [ "$n" -lt "$PP_VCPKG_WARM_MIN" ]; then
            echo "::error::vcpkg 二进制缓存未播种（archive=$n）—— 冷构建 ≈40 min，直接击穿硬顶。"
            echo "::error::→ 先跑 Actions → warm-cache → Run workflow 播种（设计 §12.4 / R24）。"
            exit 1
          fi

      - name: configure release（落 vcpkg_installed/<triplet>/share；不构建全量）
        run: |
          T0=$(date +%s)
          cmake --preset release
          echo -e "configure release（审计用）\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: 许可 ≥30 + SPDX 100%（tools/collect_licenses.py --check）
        run: |
          set -o pipefail
          T0=$(date +%s)
          python3 tools/collect_licenses.py --check 2>&1 | tee "$RUNNER_TEMP/license-check.log"
          echo -e "collect_licenses --check\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: 依赖审计（pp_linkprobe：插件面/编码器名单/版本内省断言）
        run: |
          set -o pipefail
          T0=$(date +%s)
          cmake --build build/release --target pp_linkprobe
          ./build/release/pp_linkprobe 2>&1 | tee "$RUNNER_TEMP/linkprobe.log"
          echo -e "pp_linkprobe（依赖审计）\t$(( $(date +%s) - T0 ))" >> "$RUNNER_TEMP/pp-steps.tsv"

      - name: 汇总 → $GITHUB_STEP_SUMMARY
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
        run: |
          set +e
          {
            echo "## audit job 汇总（预算 5 min / 硬顶 20 min）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 判据① | 设计 §12.2：许可 ≥30 且 SPDX 100%（\`collect_licenses.py --check\`）|"
            echo "| 判据② | 依赖审计：\`pp_linkprobe\` 退出码 0（FAIL 数 = 退出码）|"
            echo "| Qt 缓存精确命中 | ${QT_HIT:-false} |"
            echo "| vcpkg 二进制缓存精确命中 | ${VCPKG_HIT:-false} |"
            echo ""
            echo "| 阶段 | 秒 |"
            echo "| --- | --- |"
            awk -F'\t' '{printf "| %s | %s |\n", $1, $2}' "$RUNNER_TEMP/pp-steps.tsv" 2>/dev/null
            echo ""
            echo "**许可/SPDX 判据行**: \`$(grep -E '^LICENSE-CHECK ' "$RUNNER_TEMP/license-check.log" 2>/dev/null | tail -1)\`"
            echo ""
            echo "**依赖内省面**: \`$(grep -E '^PLUGINS: ' "$RUNNER_TEMP/linkprobe.log" 2>/dev/null | tail -1)\`"
            echo ""
            echo "**编码器名单**: \`$(grep -E '^HEIF_ENCODERS: ' "$RUNNER_TEMP/linkprobe.log" 2>/dev/null | tail -1)\`"
            echo ""
            echo "**PROBE 失败数**: $(grep -c ' PROBE .* FAIL ' "$RUNNER_TEMP/linkprobe.log" 2>/dev/null || echo 0)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # ----------------------------------------------------------------------------
  # regression-windows（预算 12 min，M7-WP3 / R-016，deep-review-0.3.2）: Windows 基线 diff
  #   旧口径 nightly 只在 ubuntu 跑 regression.py => tools/baseline/golden.windows.log 从不被
  #   比对（双平台回归实际只有 Linux 单腿，Windows 专有退化：路径分隔/平台分支/MSVC 日志形态
  #   永远绿）。本 job 在 windows-2025 上跑**同一脚本**（host platform = windows => 自动比对
  #   golden.windows.log）；判据与 Linux 侧逐字同源：0 diff 才绿（退出码 0/1/2 透传）。
  #   ★ 首跑若红：先看归因（.cache/regression/attribution.log 随 job 日志），确认是基线陈旧
  #     （R-015）还是真实退化，再决定 --update（口径动作）。
  # ----------------------------------------------------------------------------
  regression-windows:
    name: regression-windows（Windows 基线 diff）
    runs-on: windows-2025
    timeout-minutes: 20         # 硬顶（预算 12 min）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Qt 路径（QT_VERSION 单源 = tools/versions.env；R-063 去版本字面量）
        run: |
          "QT_DIR=$env:GITHUB_WORKSPACE/Qt/$env:QT_VERSION/msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Qt ${{ env.QT_VERSION }} 缓存（restore，写者=main-full 的 windows job）
        id: qt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/msvc2022_64
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-${{ runner.os }}-${{ runner.arch }}
          restore-keys: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-

      - name: Qt 就绪断言（缺失 => 早失败，指路 warm-cache）
        run: |
          $paths = @("$env:QT_DIR/bin/Qt6Core.dll", "$env:QT_DIR/plugins/platforms/qwindows.dll")
          $missing = @($paths | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error "Qt 缺失（未播种）: $($missing -join ', ')"
            Write-Error "→ 先跑 Actions → warm-cache → Run workflow 播种 Qt $env:QT_VERSION / win64_msvc2022_64（设计 §12.4）"
            exit 1
          }
          Write-Output "Qt OK @ $env:QT_DIR"

      - name: vcpkg ${{ env.VCPKG_TAG }}（pinned）
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout "$env:VCPKG_TAG"
          $wantSha = (Select-String -Path tools/versions.env -Pattern '^VCPKG_SHA=(.+)$').Matches.Groups[1].Value.Trim()
          $gotSha = (git -C "$env:VCPKG_ROOT" rev-parse HEAD).Trim()
          if ($gotSha -ne $wantSha) { Write-Error "vcpkg HEAD $gotSha != VCPKG_SHA $wantSha（R-091）"; exit 1 }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: 缓存目录预建
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: vcpkg binary cache（restore）
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-binary
          key: vcpkgwin-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ hashFiles('triplets/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkgwin-${{ hashFiles('vcpkg.json', 'vcpkg-overlay/**') }}-${{ hashFiles('triplets/**') }}-
            vcpkgwin-

      - name: vcpkg 缓存暖度断言（miss => 早失败，指路 warm-cache）
        run: |
          $n = @(Get-ChildItem -Recurse -File "$env:VCPKG_DEFAULT_BINARY_CACHE" -Filter *.zip -ErrorAction SilentlyContinue).Count
          Write-Output "vcpkg binary cache archives = $n（判据 ≥ $env:PP_VCPKG_WARM_MIN）"
          if ($n -lt [int]$env:PP_VCPKG_WARM_MIN) {
            Write-Error "vcpkg 二进制缓存未播种（archive=$n）—— 继续跑就是冷构建（≈40 min），直接击穿硬顶。"
            Write-Error "→ 先跑 Actions → warm-cache → Run workflow（workflow_dispatch）播种（设计 §12.4 / R24）。"
            exit 1
          }

      - name: configure + build release-dev 金样二进制（photopipeline + pp_verify）
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --preset release-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $T1 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- cmake --build build/release-dev --target photopipeline pp_verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content "$env:RUNNER_TEMP/pp-steps.tsv" "configure release-dev`t$($T1 - $T0)"
          Add-Content "$env:RUNNER_TEMP/pp-steps.tsv" "build release-dev 子集`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T1)"

      - name: 回归基线 diff（tools/regression.py；Windows 自动比对 golden.windows.log）
        # 退出码: 0 = 0 diff；1 = 有 diff；2 = 环境缺失。三种都直接透传 => 红/绿口径单一。
        run: |
          $T0 = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python tools/env.py run -- python tools/regression.py build/release-dev 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/regression-win.log"
          $rc = $LASTEXITCODE
          Add-Content "$env:RUNNER_TEMP/pp-steps.tsv" "regression-windows diff`t$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $T0)"
          if ($rc -ne 0) { exit $rc }

      - name: 汇总 → $GITHUB_STEP_SUMMARY
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
        run: |
          $lines = @()
          $lines += "## regression-windows job 汇总（预算 12 min / 硬顶 20 min）"
          $lines += ""
          $lines += "| 项目 | 值 |"
          $lines += "| --- | --- |"
          $lines += '| 判据 | tools/regression.py 归一化全语料 vs `tools/baseline/golden.windows.log`（0 diff）|'
          $lines += "| Qt / vcpkg 缓存命中 | $($env:QT_HIT) / $($env:VCPKG_HIT) |"
          $lines += ""
          $lines += "| 阶段 | 秒 |"
          $lines += "| --- | --- |"
          if (Test-Path "$env:RUNNER_TEMP/pp-steps.tsv") {
            Import-Csv -Path "$env:RUNNER_TEMP/pp-steps.tsv" -Delimiter "`t" -Header step,sec |
              ForEach-Object { $lines += "| $($_.step) | $($_.sec) |" }
          }
          $lines += ""
          $log = @(Get-Content "$env:RUNNER_TEMP/regression-win.log" -ErrorAction SilentlyContinue)
          $lines += ('**diff 结论**: ' + (($log | Where-Object { $_ -match '^regression: ' } | Select-Object -Last 3) -join ' '))
          $lines | Add-Content "$env:GITHUB_STEP_SUMMARY"

  # gate（预算 1 min）: 总闸 —— 五路全绿 + 预算校准（§12.3 / §12.6）
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: gate（总闸）
    runs-on: ubuntu-24.04
    timeout-minutes: 20         # 硬顶（本 job ≈30 s）
    needs: [asan, ubsan, tsan, regression, regression-windows, audit]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: 汇总各路结论 + 预算校准
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R_ASAN: ${{ needs.asan.result }}
          R_UBSAN: ${{ needs.ubsan.result }}
          R_TSAN: ${{ needs.tsan.result }}
          R_REG: ${{ needs.regression.result }}
          R_REG_WIN: ${{ needs.regression-windows.result }}
          R_AUDIT: ${{ needs.audit.result }}
        run: |
          set +e
          {
            echo "## nightly gate（设计 §12.6：三路并行 wall ≤20min）"
            echo ""
            echo "| job | 结论 | 预算 |"
            echo "| --- | --- | --- |"
            echo "| asan | ${R_ASAN} | 20 min（§12.3）|"
            echo "| ubsan | ${R_UBSAN} | 20 min（§12.3）|"
            echo "| tsan | ${R_TSAN} | 20 min（§12.3）|"
            echo "| regression | ${R_REG} | 12 min（表外增补：§12.1 夜间道第二段）|"
            echo "| regression-windows | ${R_REG_WIN} | 12 min（R-016：golden.windows.log 双平台第二腿）|"
            echo "| audit | ${R_AUDIT} | 5 min（表外增补：许可/SPDX/依赖审计）|"
            echo ""
            echo "run: ${GITHUB_RUN_ID} #${GITHUB_RUN_ATTEMPT} ｜ 实跑 wall-clock 见下方预算校准表"
          } >> "$GITHUB_STEP_SUMMARY"

          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
               > "$RUNNER_TEMP/jobs.json" 2>/dev/null; then
            python3 tools/ci-budget.py "$RUNNER_TEMP/jobs.json" \
              --budget "asan=20,ubsan=20,tsan=20,regression=12,regression-windows=12,audit=5,gate=1" \
              --wall-limit 20 --title "nightly 预算校准（设计 §12.3）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_预算校准表不可得（jobs API 读取失败）。_" >> "$GITHUB_STEP_SUMMARY"
          fi

          for r in "$R_ASAN" "$R_UBSAN" "$R_TSAN" "$R_REG" "$R_REG_WIN" "$R_AUDIT"; do
            [ "$r" = "success" ] || { echo "::error::夜间道未全绿（$r）—— 见各 job 汇总"; exit 1; }
          done
          echo "nightly gate OK"
